<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>${layout.Title}</title>
    $foreach(var style in layout.Styles)<link rel="stylesheet" href="${style}">
    $endfor
</head>
<body class="${layout.BodyClass}">
<header class="site-header">
    <div class="site-header__inner">
        <a class="logo" href="/">${layout.SiteName}</a>
        $if(layout.IsAdminArea)
        <span class="logo-badge">Админка</span>
        $if(layout.IsSignedIn)
        <nav class="admin-nav" aria-label="Разделы админки">
            <a href="/admin">Конусы</a>
            <a href="/admin/paths">Пути</a>
            <a href="/" target="_blank">Сайт ↗</a>
        </nav>
        <form class="admin-user" method="post" action="/admin/logout">
            <span class="admin-user__name">${layout.UserName}</span>
            <button class="link-button" type="submit">Выйти</button>
        </form>
        $endif
        $endif
    </div>
</header>
<!--body-->
$foreach(var script in layout.Scripts)<script src="${script}" defer></script>
$endfor
</body>
</html>
