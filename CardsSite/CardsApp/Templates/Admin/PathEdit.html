<main class="page admin-page">
    <div class="admin-head">
        <div>
            <a class="back-link" href="/admin/paths"><img src="/icons/arrow-left.svg" width="18" height="18" alt=""><span>К списку путей</span></a>
            <h1>${form.PageTitle}</h1>
        </div>
    </div>

    $if(form.HasError)<div class="alert alert--error" role="alert">${form.Error}</div>$endif

    <form class="admin-form" method="post" action="/admin/paths/edit" novalidate data-validate>
        <input type="hidden" name="id" value="${form.Id}">
        <section class="panel form-section">
            <div class="form-grid">
                <div class="field $if(form.Name.HasError)field--error$endif">
                    <label for="name">${form.Name.Label}</label>
                    <input id="name" name="name" value="${form.Name.Value}" maxlength="40" required
                           data-rule="pathName" data-min="2" data-label="${form.Name.Label}">
                    <p class="field__error" data-error>${form.Name.Error}</p>
                </div>
                <div class="field $if(form.Slug.HasError)field--error$endif">
                    <label for="slug">${form.Slug.Label}</label>
                    <input id="slug" name="slug" value="${form.Slug.Value}" maxlength="20" required
                           data-rule="slug" data-min="3" data-label="${form.Slug.Label}" placeholder="destruction">
                    <p class="field__hint">Используется в адресе фильтра: /?path=ключ</p>
                    <p class="field__error" data-error>${form.Slug.Error}</p>
                </div>
                <div class="field field--wide $if(form.Description.HasError)field--error$endif">
                    <label for="description">${form.Description.Label}</label>
                    <textarea id="description" name="description" rows="3" maxlength="500"
                              data-label="${form.Description.Label}" data-counter>${form.Description.Value}</textarea>
                    <p class="field__error" data-error>${form.Description.Error}</p>
                </div>
            </div>
        </section>
        <div class="form-actions">
            <button class="button button--primary" type="submit">Сохранить</button>
            <a class="button" href="/admin/paths">Отмена</a>
        </div>
    </form>
</main>
