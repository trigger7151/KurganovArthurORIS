<main class="page admin-page">
    <div class="admin-head">
        <div>
            <h1>Пути</h1>
            <p class="muted">Используются в фильтре каталога и на странице конуса.</p>
        </div>
        <a class="button button--primary" href="/admin/paths/edit">+ Добавить путь</a>
    </div>

    $if(model.HasNotice)<div class="alert $if(model.NoticeIsError)alert--error$else alert--success$endif" role="status">${model.Notice}</div>$endif

    <div class="panel table-panel">
        <table class="admin-table">
            <thead>
            <tr><th>Название</th><th>Ключ</th><th>Конусов</th><th class="admin-table__actions">Действия</th></tr>
            </thead>
            <tbody>
            $foreach(var row in model.Items)
            <tr>
                <td><a class="admin-table__name" href="${row.EditUrl}">${row.Name}</a></td>
                <td><code>${row.Slug}</code></td>
                <td>${row.ConesCount}</td>
                <td class="admin-table__actions">
                    <a class="button button--small" href="${row.EditUrl}">Изменить</a>
                    <form method="post" action="/admin/paths/delete" data-confirm="Удалить путь «${row.Name}»?">
                        <input type="hidden" name="id" value="${row.Id}">
                        <button class="button button--small button--danger" type="submit">Удалить</button>
                    </form>
                </td>
            </tr>
            $endfor
            </tbody>
        </table>
    </div>
</main>
