# Запуск: docker compose up --build   (из папки CardsApp)
# Сайт: http://localhost:8080, админка: http://localhost:8080/admin

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightcones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Скрипты выполняются автоматически при первом создании базы.
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lightcones"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: CardsApp/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONNECTION_STRING: "Host=db;Port=5432;Database=lightcones;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/static/uploads
    # Сервер читает команды из консоли (start | stop | restart | exit)
    # и завершается, если ввод закрыт, поэтому консоль держим открытой.
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
