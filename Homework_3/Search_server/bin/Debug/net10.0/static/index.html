<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Search</title>
    <style>
:root {
  font-family: Inter, Arial, Helvetica, sans-serif;
  color: #1b1b1e;
  background: #ffffff;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.site-header {
  position: absolute;
  z-index: 1;
  top: 40px;
  right: 40px;
}

.weather {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.weather__temperature {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
}

.weather__city {
  color: #6760c5;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.3;
}

.page-content {
  display: flex;
  min-height: 100vh;
  min-height: 100svh;
  flex-direction: column;
  align-items: center;
  padding: clamp(220px, 33.5vh, 420px) 24px 64px;
}

.welcome {
  text-align: center;
}

.welcome__clock {
  display: block;
  font-size: clamp(48px, 4vw, 64px);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 1.12;
  white-space: nowrap;
}

.welcome__greeting {
  margin: 18px 0 0;
  color: #665ec6;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.25;
}

.search-area {
  width: min(100%, 620px);
  margin-top: 58px;
}

.search-form {
  display: flex;
  height: 66px;
  align-items: center;
  overflow: hidden;
  border: 1px solid #f0f0f2;
  border-radius: 17px;
  background: #fbfbfc;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

.search-form:focus-within {
  border-color: #a9a4e6;
  box-shadow: 0 0 0 4px #6760c51a;
}

.search-form__button {
  display: grid;
  width: 58px;
  height: 100%;
  flex: none;
  place-items: center;
  border: 0;
  background: transparent;
}

.search-form__button svg {
  display: block;
  width: 20px;
  height: 20px;
}

.search-form__input {
  width: 100%;
  height: 100%;
  padding: 0 18px 0 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #25252b;
  font-size: 17px;
}

.search-form__input::placeholder {
  color: #aeb0b6;
  opacity: 1;
}

.search-form__input::-webkit-search-cancel-button {
  cursor: pointer;
}

.shortcuts {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 0;
  margin: 54px 0 0;
  list-style: none;
}

.shortcuts__item {
  flex: none;
}

.shortcut {
  display: grid;
  width: 64px;
  height: 64px;
  place-items: center;
  border: 1px solid #f0f0f2;
  border-radius: 17px;
  background: #fbfbfc;
  box-shadow: 0 2px 8px #00000005;
  color: #c6c6cc;
  text-decoration: none;
  transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
}

.shortcut:hover {
  transform: translateY(-3px);
  border-color: #d8d5f2;
  box-shadow: 0 6px 18px #0000000d;
}

.shortcut:focus-visible,
.search-form__button:focus-visible,
.shortcut-dialog button:focus-visible,
.shortcut-dialog input:focus-visible {
  outline: 3px solid #6760c5;
  outline-offset: 3px;
}

.shortcut svg {
  display: block;
  width: 28px;
  height: 28px;
}

.shortcut--add {
  padding: 0;
}

.shortcut--custom {
  color: #665ec6;
  font-size: 26px;
  font-weight: 700;
  text-transform: uppercase;
}

.shortcut-dialog {
  width: min(400px, calc(100% - 32px));
  padding: 28px;
  border: 1px solid #e9e8ef;
  border-radius: 20px;
  box-shadow: 0 24px 70px #18172924;
}

.shortcut-dialog::backdrop {
  background: #1b1b1e66;
}

.shortcut-dialog form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.shortcut-dialog h2 {
  margin: 0 0 10px;
  font-size: 22px;
}

.shortcut-dialog label {
  font-size: 14px;
  font-weight: 600;
}

.shortcut-dialog input {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  margin-bottom: 8px;
  border: 1px solid #dedee4;
  border-radius: 10px;
}

.shortcut-dialog__error {
  margin: 0;
  color: #b42536;
  font-size: 13px;
}

.shortcut-dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 10px;
}

.shortcut-dialog__actions button {
  min-width: 76px;
  padding: 10px 14px;
  border: 1px solid #dedee4;
  border-radius: 9px;
  background: #ffffff;
}

.shortcut-dialog__actions button[type="submit"] {
  border-color: #665ec6;
  background: #665ec6;
  color: #ffffff;
}

@media (max-width: 600px) {
  .site-header {
    top: 26px;
    right: 24px;
  }

  .weather__temperature {
    font-size: 19px;
  }

  .weather__city {
    font-size: 10px;
  }

  .page-content {
    padding: clamp(190px, 35vh, 330px) 24px 48px;
  }

  .welcome__clock {
    font-size: clamp(34px, 10.8vw, 44px);
  }

  .welcome__greeting {
    margin-top: 10px;
    font-size: clamp(17px, 4.8vw, 20px);
  }

  .search-area {
    width: min(100%, 343px);
    margin-top: clamp(150px, 25vh, 220px);
  }

  .search-form {
    height: 56px;
    border-radius: 14px;
  }

  .search-form__button {
    width: 50px;
  }

  .search-form__button svg {
    width: 18px;
    height: 18px;
  }

  .search-form__input {
    font-size: 15px;
  }

  .shortcuts {
    justify-content: flex-start;
    gap: 20px;
    padding: 0 0 8px;
    margin-top: 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .shortcuts::-webkit-scrollbar {
    display: none;
  }

  .shortcut {
    width: 52px;
    height: 52px;
    border-radius: 14px;
  }

  .shortcut svg {
    width: 25px;
    height: 25px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .search-form,
  .shortcut {
    transition: none;
  }
}

    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="weather" aria-label="Weather in Norilsk">
        <span class="weather__temperature">36°</span>
        <span class="weather__city">Norilsk</span>
      </div>
    </header>

    <main class="page-content">
      <section class="welcome" aria-label="Welcome">
        <time class="welcome__clock" id="clock">09:11:01</time>
        <h1 class="welcome__greeting" id="greeting">Good Morning, Saad.</h1>
      </section>

      <section class="search-area" aria-label="Search and shortcuts">
        <form class="search-form" action="https://www.google.com/search" method="get" role="search">
          <button class="search-form__button" type="submit" aria-label="Search Google">
            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title">
  <title id="title">Лупа</title>
  <circle cx="27" cy="27" r="17" stroke="#D1D5DB" stroke-width="5"/>
  <path d="m40 40 14 14" stroke="#D1D5DB" stroke-width="5" stroke-linecap="round"/>
</svg>
          </button>
          <label class="visually-hidden" for="search-query">Search Google</label>
          <input
            class="search-form__input"
            id="search-query"
            name="q"
            type="search"
            placeholder="Search"
            autocomplete="off"
            required
          />
        </form>

        <nav aria-label="Quick links">
          <ul class="shortcuts" id="shortcuts">
            <li class="shortcuts__item">
              <a class="shortcut" href="https://www.youtube.com/" aria-label="YouTube" title="YouTube">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect x="2" y="6" width="28" height="20" rx="6" fill="#ff2d16"/>
  <path d="m13 11 9 5-9 5z" fill="#fff"/>
</svg>
              </a>
            </li>
            <li class="shortcuts__item">
              <a class="shortcut" href="https://chatgpt.com/" aria-label="ChatGPT" title="ChatGPT">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="#262629" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M16 4c3.1-2.1 7.8.2 7.8 4.1 3.7.4 5.7 5.3 3.3 8.2 1.8 3.3-.4 7.6-4.2 7.9-1.2 3.6-6.1 4.5-8.5 1.8-3.4 1.5-7.2-1.5-6.5-5.2-2.6-2.6-2.1-7.7 1.6-9.3-.3-3.8 3.5-7.1 7.2-5.6z"/>
  <path d="m10 10 11 6-5 9M22 10l-11 6 5-9M10 22V10l11 6"/>
</svg>
              </a>
            </li>
            <li class="shortcuts__item">
              <a class="shortcut" href="https://www.geeksforgeeks.org/" aria-label="GeeksforGeeks" title="GeeksforGeeks">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <path d="M10.5 9H8a7 7 0 1 0 0 14h4v-5H8.5" fill="none" stroke="#30a952" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21.5 9H24a7 7 0 1 1 0 14h-4v-5h3.5" fill="none" stroke="#30a952" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11 14h10M11 18h10" stroke="#30a952" stroke-width="2.7" stroke-linecap="round"/>
</svg>
              </a>
            </li>
            <li class="shortcuts__item">
              <a class="shortcut" href="https://chat.deepseek.com/" aria-label="DeepSeek" title="DeepSeek">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <path d="M4 18c2-7 10-11 17-8l4-3 1 6c3 3 3 8-1 11-5 4-14 3-19-2 4 1 7 .1 8-2-4 1-7 0-10-2z" fill="#4564db"/>
  <path d="M7 15c-2-1-3-3-3-5 3 1 5 2 6 4" fill="#4564db"/>
  <circle cx="22" cy="15" r="1.3" fill="#fff"/>
  <path d="M18 20c2 1 4 1 6 0" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
              </a>
            </li>
            <li class="shortcuts__item">
              <a class="shortcut" href="https://github.com/" aria-label="GitHub" title="GitHub">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <path d="M16 3a13 13 0 0 0-4.1 25.3c.65.12.9-.28.9-.63v-2.3c-3.7.8-4.48-1.56-4.48-1.56-.6-1.52-1.47-1.92-1.47-1.92-1.2-.82.09-.8.09-.8 1.32.09 2.02 1.35 2.02 1.35 1.17 2 3.06 1.42 3.8 1.08.12-.85.46-1.42.84-1.75-2.95-.34-6.05-1.48-6.05-6.57 0-1.45.52-2.64 1.35-3.57-.13-.33-.58-1.69.13-3.52 0 0 1.1-.35 3.58 1.36A12.5 12.5 0 0 1 16 9.36c1.1 0 2.2.15 3.23.44 2.48-1.71 3.57-1.36 3.57-1.36.71 1.83.26 3.19.13 3.52.84.93 1.35 2.12 1.35 3.57 0 5.1-3.1 6.23-6.07 6.56.48.42.9 1.23.9 2.49v3.69c0 .35.24.76.91.63A13 13 0 0 0 16 3z" fill="#1b1b1e"/>
</svg>
              </a>
            </li>
            <li class="shortcuts__item">
              <a class="shortcut" href="https://www.linkedin.com/" aria-label="LinkedIn" title="LinkedIn">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect x="3" y="3" width="26" height="26" rx="3" fill="#0a78b5"/>
  <circle cx="9.5" cy="10" r="2" fill="#fff"/>
  <path d="M7.7 14h3.6v11H7.7zm6 0h3.5v1.5c.7-1.1 1.8-1.8 3.4-1.8 3.3 0 4 2.1 4 5V25H21v-5.7c0-1.2-.4-2.1-1.6-2.1-1.4 0-2.1 1-2.1 2.4V25h-3.6z" fill="#fff"/>
</svg>
              </a>
            </li>
            <li class="shortcuts__item shortcuts__item--add">
              <button class="shortcut shortcut--add" id="add-shortcut" type="button" aria-label="Add shortcut" title="Add shortcut">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </button>
            </li>
          </ul>
        </nav>
      </section>
    </main>

    <dialog class="shortcut-dialog" id="shortcut-dialog" aria-labelledby="dialog-title">
      <form id="shortcut-form">
        <h2 id="dialog-title">Add a shortcut</h2>
        <label for="shortcut-name">Name</label>
        <input id="shortcut-name" name="name" type="text" maxlength="24" required />
        <label for="shortcut-url">Website URL</label>
        <input id="shortcut-url" name="url" type="url" placeholder="https://example.com" required />
        <p class="shortcut-dialog__error" id="shortcut-error" role="alert" hidden>Enter a valid http or https URL.</p>
        <div class="shortcut-dialog__actions">
          <button type="button" id="cancel-shortcut">Cancel</button>
          <button type="submit">Add</button>
        </div>
      </form>
    </dialog>
    <script>
const clock = document.querySelector('#clock');
const greeting = document.querySelector('#greeting');
const shortcuts = document.querySelector('#shortcuts');
const addButton = document.querySelector('#add-shortcut');
const dialog = document.querySelector('#shortcut-dialog');
const shortcutForm = document.querySelector('#shortcut-form');
const cancelButton = document.querySelector('#cancel-shortcut');
const errorMessage = document.querySelector('#shortcut-error');
const shortcutName = document.querySelector('#shortcut-name');
const shortcutUrl = document.querySelector('#shortcut-url');
const storageKey = 'search-page-shortcuts';

function updateClock() {
  const now = new Date();
  clock.textContent = new Intl.DateTimeFormat('en-GB', {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
  }).format(now);
  clock.dateTime = now.toISOString();

  const hour = now.getHours();
  const partOfDay = hour < 12 ? 'Morning' : hour < 18 ? 'Afternoon' : 'Evening';
  greeting.textContent = `Good ${partOfDay}, Saad.`;
}

function createShortcut(name, url) {
  const item = document.createElement('li');
  item.className = 'shortcuts__item';

  const link = document.createElement('a');
  link.className = 'shortcut shortcut--custom';
  link.href = url;
  link.title = name;
  link.setAttribute('aria-label', name);
  link.textContent = name.trim().charAt(0);

  item.append(link);
  shortcuts.insertBefore(item, addButton.parentElement);
}

function readSavedShortcuts() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if (Array.isArray(saved)) {
      for (const entry of saved) {
        if (entry && typeof entry.name === 'string' && typeof entry.url === 'string') {
          try {
            const url = new URL(entry.url);
            if (url.protocol === 'http:' || url.protocol === 'https:') {
              createShortcut(entry.name, url.href);
            }
          } catch {
            // Skip only the invalid entry, keeping the other saved shortcuts.
          }
        }
      }
    }
  } catch {
    // Keep the default shortcuts available if local storage is disabled or invalid.
  }
}

updateClock();
setInterval(updateClock, 1000);
readSavedShortcuts();

addButton.addEventListener('click', () => {
  shortcutForm.reset();
  errorMessage.hidden = true;
  dialog.showModal();
  shortcutName.focus();
});

cancelButton.addEventListener('click', () => dialog.close());

shortcutForm.addEventListener('submit', (event) => {
  event.preventDefault();
  const name = shortcutName.value.trim();
  const rawUrl = shortcutUrl.value.trim();

  try {
    const url = new URL(rawUrl);
    if (!name || (url.protocol !== 'http:' && url.protocol !== 'https:')) {
      throw new Error('Invalid shortcut');
    }

    createShortcut(name, url.href);
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
      localStorage.setItem(storageKey, JSON.stringify([...saved, { name, url: url.href }]));
    } catch {
      // The shortcut still works for this visit if storage is unavailable.
    }
    dialog.close();
  } catch {
    errorMessage.hidden = false;
  }
});

  </script>
  </body>
</html>
