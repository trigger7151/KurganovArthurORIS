<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="https://s.rsg.sc/auth/rockstar.ico" />
    <title>Верстка</title>
  </head>
  <body>
    <div>
      <div>
        <div class="background">
          <div class="display-grid main-container min-h-f">
            <!--Центральная часть-->
            <div class="center-container">
              <!--лого рокстар-->
              <div class="logo display-flex">
                <span>
                  <img
                    src="https://s.rsg.sc/auth/images/logo_20231030.svg"
                    alt="Rockstar Games Logo"
                    data-ui-name="logo-image"
                  />
                </span>
              </div>
              <!--логин-->
              <div>
                <!--sign in-->
                <div class="background-white sign-in-container">
                  <h1>Sign in</h1>
                  <div>
                    <div>
                      <form class="form">
                        <!--email-->
                        <fieldset class="mg-b">
                          <span class="display-inline-block position-relative">
                            <input
                              class="email-input display-block"
                              id="text-input-email"
                              placeholder=""
                            />
                            <label
                              for="text-input-email"
                              class="position-absolute display-block label-text"
                            >
                              <span> Email </span>
                            </label>
                          </span>
                        </fieldset>
                        <!--password and keep me signed in-->
                        <fieldset class="mg-b">
                          <!--password-->
                          <span>
                            <span>
                              <input />
                              <label>
                                <span>Password</span>
                              </label>
                            </span>
                            <button></button>
                          </span>
                          <div></div>
                        </fieldset>
                        <fieldset>
                          <div>
                            <div>
                              <div></div>
                              <iframe> </iframe>
                            </div>
                          </div>
                        </fieldset>
                        <fieldset>
                          <div>
                            <p></p>
                            <button>
                              <div>
                                <span>Sign in</span>
                              </div>
                            </button>
                          </div>
                        </fieldset>
                      </form>
                    </div>
                  </div>
                </div>
                <!--sign in using xbox or playstation-->
                <div class="background-white">
                  <fieldset>
                    <div>
                      <p></p>
                      <div>
                        <a>
                          <img />
                        </a>
                        <a>
                          <img />
                        </a>
                      </div>
                    </div>
                  </fieldset>
                </div>
                <!--create a new account-->
                <div>
                  <p class="white-color">
                    Don't have a Rockstar account?
                    <a>Create a new account</a>
                  </p>
                </div>
              </div>
            </div>
            <!--© 2026 Rockstar Games-->
            <div class="display-block footer-grid-area footer">
              <ul class="display-block">
                <li class="display-inline-block color-grey uppercase font-0.75">
                  © 2026 Rockstar Games
                </li>
                <li
                  class="display-inline-block color-light-grey border-left-0.8 line-height-0.75"
                >
                  <button
                    class="background-transparent color-white-0.8 border-none uppercase line-height-0.75"
                  >
                    Privacy Policy
                  </button>
                </li>
                <li
                  class="display-inline-block color-light-grey border-left-0.8 line-height-0.75"
                >
                  <button
                    class="background-transparent color-white-0.8 border-none uppercase line-height-0.75"
                  >
                    Terms Of Service
                  </button>
                </li>
                <li
                  class="display-inline-block color-light-grey border-left-0.8 line-height-0.75"
                >
                  <button
                    class="background-transparent color-white-0.8 border-none uppercase line-height-0.75"
                  >
                    Cookie Settings
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
